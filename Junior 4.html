<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Junior 4 - Student Results Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --rose-bg: #fff5f7;
            --rose-card: rgba(255, 255, 255, 0.95);
            --rose-primary: #f472b6;
            --rose-hover: #ec4899;
            --rose-light: #fce7f3;
            --purple-accent: #c084fc;
            --text-title: #471825;
            --text-subtitle: #835261;
            --text-body: #5c3d46;
            --card-border: #fbcfe8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fff0f5 0%, #f3e8ff 50%, #e0f2fe 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-body);
        }

        .container {
            background: var(--rose-card);
            padding: 35px 30px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(244, 114, 182, 0.15);
            width: 100%;
            max-width: 1250px;
            text-align: center;
            border: 2px solid #ffffff;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .container.search-mode {
            max-width: 550px;
        }

        .logo-wrapper {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--rose-primary);
            box-shadow: 0 0 20px rgba(244, 114, 182, 0.3);
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .school-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-title);
            margin-bottom: 6px;
            background: linear-gradient(45deg, #db2777, #9333ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-subtitle);
            margin-bottom: 25px;
            font-weight: 500;
        }

        /* Form Styling */
        .id-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .input-group {
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--rose-primary);
            font-size: 18px;
        }

        .id-input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border-radius: 16px;
            border: 2px solid var(--card-border);
            outline: none;
            font-size: 15px;
            transition: 0.3s;
            background: #ffffff;
            color: var(--text-title);
        }

        .id-input:focus {
            border-color: var(--rose-primary);
            box-shadow: 0 0 12px rgba(244, 114, 182, 0.3);
        }

        .submit-btn {
            background: linear-gradient(45deg, var(--rose-primary), var(--rose-hover));
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(236, 72, 153, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.4);
        }

        /* Report Form Styling */
        .school-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
            border-bottom: 2px solid #533d08;
            padding-bottom: 15px;
        }

        .header-left {
            text-align: left;
            line-height: 1.5;
            font-size: 0.95rem;
            font-weight: bold;
            color: #0b1016;
            flex: 1;
            min-width: 250px;
        }

        .school-logo {
            max-height: 75px;
            object-fit: contain;
        }

        .report-h2 {
            color: #292727;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 15px;
            font-size: 1.3rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .report-subtitle {
            color: #533d08; 
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;  
            margin-top: 5px;
            margin-bottom: 15px;
            position: relative;
        }

        .report-subtitle::after {
            content: "";          
            display: block;       
            width: 60px;          
            height: 3px;          
            background-color: #533d08; 
            margin: 8px auto 0 auto; 
            border-radius: 2px;   
        }

        .student-info {
            background-color: #fcf8f8;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            text-align: left;
        }

        .info-item { 
            font-size: 0.95rem; 
            flex: 1;
            min-width: 200px;
            color: #334155;
        }
        .info-item span { color: #64748b; font-size: 0.85rem; }
        .info-item strong { color: #533d08; font-size: 1.05rem; }

        .table-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 10px;
            border: 2px solid #000000;
            margin-bottom: 15px;
        }

        table.report-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
            text-align: center;
            font-size: 0.85rem;
        }

        table.report-table th, table.report-table td {
            padding: 8px 5px;
            border: 1px solid #000000;
            color: #000000;
        }

        table.report-table th {
            background-color: #e2e8f0;
            font-weight: bold;
        }

        .subject-col-header {
            background-color: #f1f5f9 !important;
            font-weight: bold;
        }

        .row-subject-name {
            font-weight: bold;
            text-align: left;
            padding-left: 10px !important;
            background-color: #ffffff;
        }

        .total-row {
            font-weight: bold;
            background-color: #f8fafc;
            font-size: 0.95rem;
        }

        /* Signatures Layout Adjustments */
        .signatures-container {
            display: flex; 
            flex-direction: row-reverse;
            justify-content: space-between;
            gap: 15px; 
            text-align: center;
            margin-top: 25px; 
            padding-top: 15px; 
            border-top: 1px dashed #cbd5e1;
        }

        .signature-box { 
            flex: 1; 
            min-width: 220px; 
            font-size: 0.88rem; 
            color: #475569; 
            line-height: 1.6; 
        }

        .signature-box.spacer {
            visibility: hidden;
        }

        .signature-box strong { 
            display: block; 
            color: #0c0606; 
            font-size: 0.95rem; 
            margin-top: 4px; 
        }

        .actions { text-align: center; margin-top: 20px; display: flex; justify-content: center; gap: 15px; }

        .action-btn {
            display: inline-flex; align-items: center; gap: 8px; color: #ffffff; background-color: #533d08;
            text-decoration: none; font-weight: bold; padding: 10px 25px; border-radius: 10px; font-size: 0.9rem;
            border: none; cursor: pointer; transition: 0.2s;
        }
        .action-btn:hover { opacity: 0.9; transform: translateY(-2px); }

        .hidden { display: none !important; }

        /* Print Media Landscape Styling */
        @media print {
            @page { size: A4 landscape; margin: 4mm 5mm !important; }
            body { background-color: #ffffff !important; color: #000000 !important; padding: 0 !important; margin: 0 !important; min-height: auto !important; display: block !important; }
            .container { background-color: #ffffff !important; border: none !important; box-shadow: none !important; padding: 0 !important; max-width: 100% !important; width: 100% !important; display: block !important; }
            .school-header { display: table !important; width: 100% !important; border-bottom: 2px solid #000000 !important; margin-bottom: 8px !important; padding-bottom: 8px !important; }
            .header-left { display: table-cell !important; text-align: left !important; color: #000000 !important; font-size: 0.85rem !important; }
            .header-right { display: table-cell !important; text-align: right !important; vertical-align: middle !important; }
            .school-logo { max-height: 55px !important; }

            .report-h2 { color: #000000 !important; margin-top: 2px !important; margin-bottom: 2px !important; font-size: 1.1rem !important; }
            .report-subtitle { color: #000000 !important; font-size: 1rem !important; margin-top: 2px !important; margin-bottom: 5px !important; }
            
            .student-info { display: table !important; width: 100% !important; background-color: #ffffff !important; border: 1px solid #000000 !important; padding: 6px 10px !important; margin-bottom: 8px !important; }
            .info-item { display: table-cell !important; width: 33.33% !important; font-size: 0.85rem !important; }
            
            .table-container { border: 2px solid #000000 !important; margin-bottom: 8px !important; }
            table.report-table { background-color: #ffffff !important; font-size: 0.75rem !important; width: 100% !important; }
            table.report-table th, table.report-table td { border: 1px solid #000000 !important; color: #000000 !important; padding: 5px 2px !important; }

            .signatures-container { 
                display: flex !important; 
                flex-direction: row-reverse !important;
                justify-content: space-between !important;
                width: 100% !important; 
                border-top: 1px dashed #000000 !important; 
                margin-top: 8px !important; 
                padding-top: 6px !important; 
            }
            .signature-box { 
                flex: 1 !important;
                color: #000000 !important; 
                font-size: 0.75rem !important; 
                text-align: center !important; 
            }

            .no-print, .actions, #searchSection { display: none !important; }
        }
    </style>
</head>
<body>

    <div id="mainContainer" class="container search-mode">
        
        <!-- 🔴 Stage 1: ID Search Input -->
        <div id="searchSection">
            <div class="logo-wrapper">
                <img src="logo.jpg" alt="Girls School Logo" onerror="this.src='https://via.placeholder.com/90/fce7f3/db2777?text=SLS';">
            </div>
            <h1 class="school-title">New Sidi Gaber Language School Ring Road for Girls</h1>
            <p class="subtitle">Junior 4 Student Performance Report Portal</p>

            <div class="id-form">
                <div class="input-group">
                    <i class="fa-solid fa-id-card"></i>
                    <input type="text" id="nationalIdInput" class="id-input" placeholder="Enter Student National ID" maxlength="14">
                </div>
                <button class="submit-btn" onclick="fetchStudentReport()">
                    View Student Result <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

            <div class="actions" style="margin-top: 15px;">
                <a href="index.html" class="action-btn" style="background: transparent; color: var(--text-subtitle); border: 1px solid var(--card-border);">
                    <i class="fa-solid fa-arrow-left"></i> Back to Main Portal
                </a>
            </div>
        </div>

        <!-- 🟢 Stage 2: Comprehensive Report Card Table -->
        <div id="reportSection" class="hidden">
            <div class="school-header">
                <div class="header-left">
                    Alexandria Governorate<br>
                    Middle Education Zone<br>
                    Sidi Gaber Language School Ring Road for Girls
                </div>
                <div class="header-right">
                    <img src="logo.jpg" alt="School Logo" class="school-logo" onerror="this.src='https://via.placeholder.com/75/fce7f3/db2777?text=SLS';">
                </div>
            </div>

            <h2 class="report-h2"> October : 2026/2027</h2>
            <p class="report-subtitle">Report - Junior Four</p>
                
            <div id="report-content">
                <!-- Data inserted dynamically -->
            </div>

            <div class="actions no-print">
                <button onclick="newSearch()" class="action-btn" style="background-color: #64748b;">
                    <i class="fa-solid fa-magnifying-glass"></i> Search Another ID
                </button>
                <button onclick="window.print()" class="action-btn">
                    <i class="fa-solid fa-print"></i> Print Report
                </button>
            </div>
        </div>

    </div>

    <script>
        function parseCSVLine(text) {
            let result = [];
            let cell = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (c === '"') { inQuotes = !inQuotes; }
                else if (c === ',' && !inQuotes) {
                    result.push(cell.trim());
                    cell = '';
                } else { cell += c; }
            }
            result.push(cell.trim());
            return result;
        }

        async function fetchStudentReport() {
            const idVal = document.getElementById('nationalIdInput').value.trim();
            if (!idVal) {
                alert('Please enter National ID');
                return;
            }

            try {
                const response = await fetch('Junior 4.csv');
                if (!response.ok) throw new Error("Could not load database file (Junior 4.csv).");
                const csvText = await response.text();
                processFullReport(csvText, idVal);
            } catch (err) {
                alert("Error: " + err.message);
            }
        }

        function processFullReport(csvText, idToFind) {
            const lines = csvText.split(/\r?\n/).map(line => line.trim()).filter(line => line.length > 0);
            if (lines.length === 0) {
                alert('Database file (Junior 4.csv) is empty!');
                return;
            }

            const headers = parseCSVLine(lines[0]).map(h => h.replace(/^"|"$/g, '').trim());
            let studentData = null;

            let idIndex = headers.indexOf('ID');
            if (idIndex === -1) idIndex = headers.indexOf('NationalID');
            if (idIndex === -1) idIndex = 0;

            for (let i = 1; i < lines.length; i++) {
                const columns = parseCSVLine(lines[i]).map(c => c.replace(/^"|"$/g, '').trim());
                if (columns[idIndex] === idToFind) {
                    studentData = columns;
                    break;
                }
            }

            if (!studentData) {
                alert(`The National ID (${idToFind}) is not registered in Junior 4 database.`);
                return;
            }

            const getVal = (headerName) => {
                const idx = headers.indexOf(headerName);
                if (idx !== -1 && studentData[idx] !== undefined && studentData[idx] !== '') {
                    return studentData[idx];
                }
                return '-';
            };

            const numVal = (val) => {
                const parsed = parseFloat(val);
                return isNaN(parsed) ? 0 : parsed;
            };

            const name = getVal('StudentNameEnglish');
            const studentClass = getVal('Class');

            // 1. قراءة الدرجات من شيت Junior 4 لجميع المواد (9 مواد)
            const arabic_Monthly = getVal('Arabic_MonthlyTest');
            const arabic_HW = getVal('Arabic_Homework');
            const arabic_Copybook = getVal('Arabic_ClasscopyBook');
            const arabic_Weekly = getVal('Arabic_WeeklyEvaluation');
            const arabic_Behavior = getVal('Arabic_Behavior');
            let arabic_Total = getVal('Arabic_Total');

            const math_Monthly = getVal('Math_MonthlyTest');
            const math_HW = getVal('Math_Homework');
            const math_Copybook = getVal('Math_Class copybook');
            const math_Weekly = getVal('Math_WeeklyEvaluation');
            const math_Behavior = getVal('Math_Behavior');
            let math_Total = getVal('Math_Total');

            const engOL_Monthly = getVal('EnglishOL_MonthlyTest');
            const engOL_HW = getVal('EnglishOL_Homework');
            const engOL_Copybook = getVal('EnglishOL_class copybook');
            const engOL_Weekly = getVal('EnglishOL_WeeklyEvaluation');
            const engOL_Behavior = getVal('EnglishOL_Behavior');
            let engOL_Total = getVal('EnglishOL_Total');

            const science_Monthly = getVal('Science_MonthlyTest');
            const science_HW = getVal('Science_Homework');
            const science_Copybook = getVal('Science_Copybook');
            const science_Weekly = getVal('Science_WeeklyEvaluation');
            const science_Behavior = getVal('Science_Behavior');
            let science_Total = getVal('Science_total');

            const ss_Monthly = getVal('SocialStudies_MonthlyTest');
            const ss_HW = getVal('SocialStudies_Homework');
            const ss_Copybook = getVal('SocialStudies_Copybook');
            const ss_Weekly = getVal('SocialStudies_WeeklyEvaluation');
            const ss_Behavior = getVal('SocialStudies_Behavior');
            let ss_Total = getVal('SocialStudies_Total');

            const rel_Monthly = getVal('Religion_MonthlyTest');
            const rel_HW = getVal('Religion_Homework');
            const rel_Copybook = getVal('Religion_Class copybook');
            const rel_Weekly = getVal('Religion_WeeklyEvaluation');
            const rel_Behavior = getVal('Religion_Behavior');
            let rel_Total = getVal('Religion_Total');

            const ict_Monthly = getVal('ICT_MonthlyTest');
            const ict_HW = getVal('ICT_HomeWork');
            const ict_Copybook = getVal('ICT_Class Copybook');
            const ict_Weekly = getVal('ICT_WeeklyEvaluation');
            const ict_Behavior = getVal('ICT_Behavior');
            let ict_Total = getVal('ICT_Total');

            const engAL_Monthly = getVal('EnglishAL_MonthlyTest');
            const engAL_HW = getVal('EnglishAL_Homework');
            const engAL_Copybook = getVal('EnglishAL_Class copybook');
            const engAL_Weekly = getVal('EnglishAL_WeeklyEvaluation');
            const engAL_Behavior = getVal('EnglishAL_Behavior');
            let engAL_Total = getVal('EnglishAL_Total');

            const french_Monthly = getVal('French_MonthlyTest');
            const french_HW = getVal('French_Homework');
            const french_Copybook = getVal('French_Class copybook');
            const french_Weekly = getVal('French_WeeklyEvaluation');
            const french_Behavior = getVal('French_Behavior');
            let french_Total = getVal('French_Total');

            // 2. حساب الجمع التلقائي إذا كانت الخانة فارغة
            if (arabic_Total === '-') arabic_Total = numVal(arabic_Monthly) + numVal(arabic_HW) + numVal(arabic_Copybook) + numVal(arabic_Weekly) + numVal(arabic_Behavior);
            if (math_Total === '-') math_Total = numVal(math_Monthly) + numVal(math_HW) + numVal(math_Copybook) + numVal(math_Weekly) + numVal(math_Behavior);
            if (engOL_Total === '-') engOL_Total = numVal(engOL_Monthly) + numVal(engOL_HW) + numVal(engOL_Copybook) + numVal(engOL_Weekly) + numVal(engOL_Behavior);
            if (science_Total === '-') science_Total = numVal(science_Monthly) + numVal(science_HW) + numVal(science_Copybook) + numVal(science_Weekly) + numVal(science_Behavior);
            if (ss_Total === '-') ss_Total = numVal(ss_Monthly) + numVal(ss_HW) + numVal(ss_Copybook) + numVal(ss_Weekly) + numVal(ss_Behavior);
            if (rel_Total === '-') rel_Total = numVal(rel_Monthly) + numVal(rel_HW) + numVal(rel_Copybook) + numVal(rel_Weekly) + numVal(rel_Behavior);
            if (ict_Total === '-') ict_Total = numVal(ict_Monthly) + numVal(ict_HW) + numVal(ict_Copybook) + numVal(ict_Weekly) + numVal(ict_Behavior);
            if (engAL_Total === '-') engAL_Total = numVal(engAL_Monthly) + numVal(engAL_HW) + numVal(engAL_Copybook) + numVal(engAL_Weekly) + numVal(engAL_Behavior);
            if (french_Total === '-') french_Total = numVal(french_Monthly) + numVal(french_HW) + numVal(french_Copybook) + numVal(french_Weekly) + numVal(french_Behavior);

            // 3. بناء جدول Junior 4 المكون من 9 مواد وفق الصورة
            let reportHTML = `
                <div class="student-info">
                    <div class="info-item"><span>Student Name:</span> <br><strong>${name}</strong></div>
                    <div class="info-item"><span>National ID:</span> <br><strong>${idToFind}</strong></div>
                    <div class="info-item"><span>Class:</span> <br><strong>${studentClass}</strong></div>
                </div>

                <div class="table-container">
                    <table class="report-table">
                        <thead>
                            <tr>
                                <th rowspan="2" style="width: 150px; vertical-align: middle;">Subject</th>
                                <th rowspan="2" style="width: 65px; vertical-align: middle;">Average grade</th>
                                <th colspan="5" class="subject-col-header">Subjects added to total</th>
                                <th colspan="4" class="subject-col-header">Subjects not added to total</th>
                            </tr>
                            <tr>
                                <th style="width: 90px;">Arabic</th>
                                <th style="width: 90px;">Mathematics</th>
                                <th style="width: 90px;">English (O.L)</th>
                                <th style="width: 90px;">Science</th>
                                <th style="width: 90px;">Social Studies</th>
                                <th style="width: 90px;">Religion</th>
                                <th style="width: 90px;">ICT</th>
                                <th style="width: 90px;">English (A.L)</th>
                                <th style="width: 90px;">French</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="row-subject-name">Monthly Evaluation</td>
                                <td><strong>15</strong></td>
                                <td>${arabic_Monthly}</td>
                                <td>${math_Monthly}</td>
                                <td>${engOL_Monthly}</td>
                                <td>${science_Monthly}</td>
                                <td>${ss_Monthly}</td>
                                <td>${rel_Monthly}</td>
                                <td>${ict_Monthly}</td>
                                <td>${engAL_Monthly}</td>
                                <td>${french_Monthly}</td>
                            </tr>
                            <tr>
                                <td class="row-subject-name">Homework</td>
                                <td><strong>5</strong></td>
                                <td>${arabic_HW}</td>
                                <td>${math_HW}</td>
                                <td>${engOL_HW}</td>
                                <td>${science_HW}</td>
                                <td>${ss_HW}</td>
                                <td>${rel_HW}</td>
                                <td>${ict_HW}</td>
                                <td>${engAL_HW}</td>
                                <td>${french_HW}</td>
                            </tr>
                            <tr>
                                <td class="row-subject-name">Class Notebook</td>
                                <td><strong>5</strong></td>
                                <td>${arabic_Copybook}</td>
                                <td>${math_Copybook}</td>
                                <td>${engOL_Copybook}</td>
                                <td>${science_Copybook}</td>
                                <td>${ss_Copybook}</td>
                                <td>${rel_Copybook}</td>
                                <td>${ict_Copybook}</td>
                                <td>${engAL_Copybook}</td>
                                <td>${french_Copybook}</td>
                            </tr>
                            <tr>
                                <td class="row-subject-name">Weekly Evaluation</td>
                                <td><strong>10</strong></td>
                                <td>${arabic_Weekly}</td>
                                <td>${math_Weekly}</td>
                                <td>${engOL_Weekly}</td>
                                <td>${science_Weekly}</td>
                                <td>${ss_Weekly}</td>
                                <td>${rel_Weekly}</td>
                                <td>${ict_Weekly}</td>
                                <td>${engAL_Weekly}</td>
                                <td>${french_Weekly}</td>
                            </tr>
                            <tr>
                                <td class="row-subject-name">Attendance & Conduct</td>
                                <td><strong>5</strong></td>
                                <td>${arabic_Behavior}</td>
                                <td>${math_Behavior}</td>
                                <td>${engOL_Behavior}</td>
                                <td>${science_Behavior}</td>
                                <td>${ss_Behavior}</td>
                                <td>${rel_Behavior}</td>
                                <td>${ict_Behavior}</td>
                                <td>${engAL_Behavior}</td>
                                <td>${french_Behavior}</td>
                            </tr>
