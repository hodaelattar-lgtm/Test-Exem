<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Sidi Gaber Language School Ring Road for Girls - Results Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --rose-bg: #fff5f7;
            --rose-card: rgba(255, 255, 255, 0.95);
            --rose-primary: #f472b6;
            --rose-hover: #ec4899;
            --rose-light: #fce7f3;
            --purple-accent: #c084fc;
            --text-title: #471825;
            --text-subtitle: #835261;
            --text-body: #5c3d46;
            --card-border: #fbcfe8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fff0f5 0%, #f3e8ff 50%, #e0f2fe 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-body);
        }

        .container {
            background: var(--rose-card);
            padding: 35px 30px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(244, 114, 182, 0.15);
            width: 100%;
            max-width: 650px;
            text-align: center;
            border: 2px solid #ffffff;
            backdrop-filter: blur(10px);
        }

        .logo-wrapper {
            width: 95px;
            height: 95px;
            margin: 0 auto 15px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--rose-primary);
            box-shadow: 0 0 20px rgba(244, 114, 182, 0.3);
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .school-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-title);
            margin-bottom: 6px;
            background: linear-gradient(45deg, #db2777, #9333ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-subtitle);
            margin-bottom: 30px;
            font-weight: 500;
        }

        .step-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--rose-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }

        .btn-card {
            background: #ffffff;
            border: 2px solid var(--card-border);
            padding: 18px 12px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-title);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .btn-card i {
            font-size: 24px;
            color: var(--rose-primary);
        }

        .btn-card:hover {
            border-color: var(--rose-primary);
            background: var(--rose-light);
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(244, 114, 182, 0.2);
        }

        .back-btn {
            background: transparent;
            border: none;
            color: var(--text-subtitle);
            font-size: 14px;
            cursor: pointer;
            margin-top: 15px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            font-weight: 600;
        }

        .back-btn:hover {
            color: var(--rose-hover);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo & Titles -->
        <div class="logo-wrapper">
            <img src="logo.jpg" alt="Girls School Logo" onerror="this.src='https://via.placeholder.com/95/fce7f3/db2777?text=SLS';">
        </div>
        <h1 class="school-title">New Sidi Gaber Language School Ring Road for Girls</h1>
        <p class="subtitle">Official Student Performance Report Portal</p>

        <!-- 1. Educational Stages -->
        <div id="stageSection">
            <div class="step-title"><i class="fa-solid fa-layer-group"></i> Select Educational Stage</div>
            <div class="grid-container">
                <button class="btn-card" onclick="selectStage('junior')">
                    <i class="fa-solid fa-child-reaching"></i> Junior Stage
                </button>
                <button class="btn-card" onclick="selectStage('middle')">
                    <i class="fa-solid fa-user-graduate"></i> Middle Stage
                </button>
                <button class="btn-card" onclick="selectStage('senior')">
                    <i class="fa-solid fa-school"></i> Senior Stage
                </button>
            </div>
        </div>

        <!-- 1.5 Sub Stage (Junior Levels) -->
        <div id="subStageSection" class="hidden">
            <div class="step-title"><i class="fa-solid fa-sitemap"></i> Select Level</div>
            <div class="grid-container">
                <button class="btn-card" onclick="selectSubStage('lower')">
                    <i class="fa-solid fa-shapes"></i> Lower Junior
                </button>
                <button class="btn-card" onclick="selectSubStage('upper')">
                    <i class="fa-solid fa-cubes"></i> Upper Junior
                </button>
            </div>
        </div>

        <!-- 2. Select Grade -->
        <div id="gradeSection" class="hidden">
            <div class="step-title"><i class="fa-solid fa-graduation-cap"></i> Select Grade</div>
            <div class="grid-container" id="gradeContainer"></div>
        </div>

        <!-- Back Button -->
        <button id="backBtn" class="back-btn" onclick="goBack()">
            <i class="fa-solid fa-arrow-left"></i> Back to previous step
        </button>
    </div>

    <script>
        const schoolData = {
            junior: {
                subStages: {
                    lower: ["Junior 1", "Junior 2", "Junior 3"],
                    upper: ["Junior 4", "Junior 5", "Junior 6"]
                }
            },
            middle: ["Middle 1", "Middle 2", "Middle 3"],
            senior: ["Senior 1", "Senior 2", "Senior 2 Bachelory"]
        };

        let currentStep = 'stage';
        let selectedStageKey = null;

        function selectStage(stageKey) {
            selectedStageKey = stageKey;

            if (stageKey === 'junior') {
                document.getElementById('stageSection').classList.add('hidden');
                document.getElementById('subStageSection').classList.remove('hidden');
                document.getElementById('backBtn').style.display = 'flex';
                currentStep = 'subStage';
            } else {
                renderGrades(schoolData[stageKey]);
                document.getElementById('stageSection').classList.add('hidden');
                document.getElementById('gradeSection').classList.remove('hidden');
                document.getElementById('backBtn').style.display = 'flex';
                currentStep = 'grade';
            }
        }

        function selectSubStage(subStageKey) {
            const grades = schoolData.junior.subStages[subStageKey];
            renderGrades(grades);

            document.getElementById('subStageSection').classList.add('hidden');
            document.getElementById('gradeSection').classList.remove('hidden');
            currentStep = 'grade';
        }

        function renderGrades(grades) {
            const gradeContainer = document.getElementById('gradeContainer');
            gradeContainer.innerHTML = '';

            grades.forEach(gradeName => {
                const btn = document.createElement('button');
                btn.className = 'btn-card';
                btn.innerHTML = `<i class="fa-solid fa-book-open-reader"></i> ${gradeName}`;
                // التوجيه المباشر لصفحة الصف المحددة
                btn.onclick = () => {
                    window.location.href = encodeURI(`${gradeName}.html`);
                };
                gradeContainer.appendChild(btn);
            });
        }

        function goBack() {
            if (currentStep === 'grade') {
                document.getElementById('gradeSection').classList.add('hidden');
                if (selectedStageKey === 'junior') {
                    document.getElementById('subStageSection').classList.remove('hidden');
                    currentStep = 'subStage';
                } else {
                    document.getElementById('stageSection').classList.remove('hidden');
                    document.getElementById('backBtn').style.display = 'none';
                    currentStep = 'stage';
                }
            } else if (currentStep === 'subStage') {
                document.getElementById('subStageSection').classList.add('hidden');
                document.getElementById('stageSection').classList.remove('hidden');
                document.getElementById('backBtn').style.display = 'none';
                currentStep = 'stage';
            }
        }
    </script>
</body>
</html>
